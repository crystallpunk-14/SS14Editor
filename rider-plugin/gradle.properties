pluginVersion=0.1.0

# The oldest Rider the plugin supports (sinceBuild 253): compiled against it, so
# no newer-only API slips in. Its SDK is downloaded once; point `riderPath` at a
# local install of that same version to skip the download (-PriderPath=...).
riderVersion=2025.3.4
riderPath=

# The newest Rider, checked by `verifyPlugin` alongside `riderVersion`. A local
# install at `riderLatestPath` is used when it exists; otherwise it is downloaded (CI).
riderLatestVersion=2026.2.4
riderLatestPath=C:/Program Files/JetBrains/JetBrains Rider 2026.2.4

kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g
